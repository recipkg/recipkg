name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the reference CLI
        run: python -m pip install ./generated
      - name: Check the protocol and CLI
        run: RECIPKG_RECIPE_ROOT="$GITHUB_WORKSPACE" python -m unittest discover -s generated/tests -v
      - name: Exercise the installed package
        run: |
          recipkg --version
          recipkg pack examples/hello -o hello-0.1.0.recipe.tar.gz
          recipkg check hello-0.1.0.recipe.tar.gz
          recipkg build hello-0.1.0.recipe.tar.gz --output hello-task.md
          recipkg skills sync --dest agent-skills
