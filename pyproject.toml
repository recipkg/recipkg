[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipkg"
version = "0.1.0"
description = "Markdown-only software recipes and standardized prompts for any coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LIghtJUNction"}]
keywords = ["agent", "prompt", "skills", "package-manager", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
recipkg = "recipkg.cli:main"

[project.urls]
Repository = "https://github.com/LIghtJUNction/recipkg"
Specification = "https://github.com/LIghtJUNction/recipkg/blob/main/docs/SPEC.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recipkg = ["data/templates/*.md", "data/skills/*/*.md"]
